name: Auto-tag and publish

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/streamtex/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # PNG/JPG/WebP/MP4/GIF are Git LFS files (.gitattributes).
          # Without lfs:true the build packages 130-byte POINTER FILES
          # instead of the real binaries (issue #50) — ci.yml already
          # checks out with lfs:true, this workflow must too.
          lfs: true

      - name: Detect version bump
        id: version
        run: |
          NEW=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          OLD=$(git show HEAD~1:pyproject.toml 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ] && [ -n "$NEW" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.version.outputs.bumped == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        if: steps.version.outputs.bumped == 'true'
        run: uv python install

      - name: Install dependencies
        if: steps.version.outputs.bumped == 'true'
        run: uv sync --frozen

      - name: Run tests
        if: steps.version.outputs.bumped == 'true'
        run: uv run pytest tests/ -v

      - name: Lint
        if: steps.version.outputs.bumped == 'true'
        run: uv run ruff check streamtex/

      - name: Build package
        if: steps.version.outputs.bumped == 'true'
        run: uv build

      - name: Guard — no Git LFS pointers in artifacts (issue #50)
        if: steps.version.outputs.bumped == 'true'
        run: |
          uv run python - <<'EOF'
          import sys, tarfile, zipfile
          from pathlib import Path
          SIG = b"version https://git-lfs.github.com/spec"
          bad = []
          for whl in sorted(Path("dist").glob("*.whl")):
              z = zipfile.ZipFile(whl)
              for n in z.namelist():
                  if z.read(n)[:64].lstrip().startswith(SIG):
                      bad.append(f"{whl.name}:{n}")
          for sdist in sorted(Path("dist").glob("*.tar.gz")):
              with tarfile.open(sdist) as t:
                  for m in t.getmembers():
                      if not m.isfile():
                          continue
                      f = t.extractfile(m)
                      if f and f.read(64).lstrip().startswith(SIG):
                          bad.append(f"{sdist.name}:{m.name}")
          if bad:
              print("Git LFS pointer files in distribution artifacts:")
              print("\n".join(" - " + b for b in bad))
              sys.exit(1)
          print("OK: no LFS pointer files in dist artifacts")
          EOF

      - name: Publish to PyPI
        if: steps.version.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI (manual publish, re-run) is not an
          # error: skip it instead of failing the run with 400 (issue #36).
          skip-existing: true

      - name: Create GitHub release
        if: steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.new }}"
          BODY=$(awk "/^## \[${VERSION#v}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $VERSION"
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$BODY" \
            --target main
