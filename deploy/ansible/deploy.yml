# StreamTeX Ansible Playbook — Deploy to GCP Compute Engine VM
#
# Usage:
#   ansible-playbook -i inventory.ini deploy.yml
#
# Before running:
#   1. Copy inventory.ini.example to inventory.ini and fill in your values
#   2. Update the vars below to match your project
#   3. Ensure SSH access works: ssh -i ~/.ssh/id_ed25519 your-user@your-vm-ip

- name: Deploy StreamTeX App on Google Cloud VM
  hosts: webserver
  become: yes

  vars:
    # ──── CUSTOMIZE THESE ────────────────────────────────
    user: "YOUR_USERNAME"
    repo_url: "git@github.com:YOUR_GITHUB_USER/YOUR_REPO.git"
    project_folder: "projects/YOUR_PROJECT"       # Relative path inside the repo
    # ──── END CUSTOMIZATION ──────────────────────────────

    project_dir: "/home/{{ user }}/streamtex_app"
    venv_dir: "/home/{{ user }}/streamtex_env"
    streamtex_script: "{{ project_dir }}/{{ project_folder }}/book.py"

  tasks:

    - name: Update and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - python3.11
          - python3.11-venv
          - python3-pip
          - git
          - curl
        state: present

    - name: Ensure project directory exists
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ user }}"
        group: "{{ user }}"

    - name: Clone the GitHub repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}/repo"
        version: main
        force: yes
      environment:
        GIT_SSH_COMMAND: "ssh -i /home/{{ user }}/.ssh/id_ed25519 -o StrictHostKeyChecking=no"

    - name: Copy project folder from the repo
      command: cp -r "{{ project_dir }}/repo/{{ project_folder }}" "{{ project_dir }}/"

    - name: Copy streamtex library from the repo
      command: cp -r "{{ project_dir }}/repo/streamtex" "{{ project_dir }}/"

    - name: Copy pyproject.toml from the repo
      command: cp "{{ project_dir }}/repo/pyproject.toml" "{{ project_dir }}/"

    - name: Create virtual environment
      command:
        cmd: "python3.11 -m venv {{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install dependencies inside virtual environment
      pip:
        virtualenv: "{{ venv_dir }}"
        requirements: "{{ project_dir }}/repo/requirements.txt"
      ignore_errors: yes

    - name: Install dependencies from pyproject.toml (fallback)
      pip:
        virtualenv: "{{ venv_dir }}"
        name:
          - "streamlit>=1.54.0"
          - "beautifulsoup4>=4.10.0"
          - "requests>=2.28.0"
          - "watchdog"
          - "graphviz>=0.21"
          - "matplotlib>=3.10.8"
          - "streamlit-mermaid>=0.3.0"
          - "mermaid-py>=0.5.0"
          - "streamlit-ace>=0.1.1"

    - name: Create a systemd service for StreamTeX
      copy:
        dest: /etc/systemd/system/streamtex.service
        content: |
          [Unit]
          Description=StreamTeX Web Book
          After=network.target

          [Service]
          ExecStart={{ venv_dir }}/bin/python3 -m streamlit run {{ streamtex_script }} --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.address 0.0.0.0
          Restart=always
          User={{ user }}
          WorkingDirectory={{ project_dir }}/{{ project_folder }}

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Enable and start StreamTeX service
      systemd:
        name: streamtex
        enabled: yes
        state: restarted
