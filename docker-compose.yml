# StreamTeX — Docker Compose for multi-project local deployment
# Usage:
#   docker compose up --build           # Build and run all 3 projects
#   docker compose up --build intro     # Build and run only the intro project
#   docker compose up -d                # Run in background (detached)
#   docker compose down                 # Stop all projects
#   docker compose logs -f intro        # Follow logs for a specific project

services:
  collection:
    build:
      context: .
      args:
        FOLDER: documentation/manuals/stx_manuals_collection
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  intro:
    build:
      context: .
      args:
        FOLDER: documentation/manuals/stx_manual_intro
    ports:
      - "8502:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  advanced:
    build:
      context: .
      args:
        FOLDER: documentation/manuals/stx_manual_advanced
    ports:
      - "8503:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
