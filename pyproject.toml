[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamtex"
version = "0.2.0"
description = "A Streamlit wrapper for styled content rendering"
readme = "documentation/streamtex_cheatsheet_en.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.54.0",
    "beautifulsoup4>=4.10.0",
    "requests>=2.28.0",
    "watchdog",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["streamtex*"]

[tool.setuptools.package-data]
"streamtex.static" = ["*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
