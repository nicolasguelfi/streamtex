[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamtex"
version = "0.2.0"
description = "A Streamlit wrapper for styled content rendering"
readme = "documentation/streamtex_cheatsheet_en.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "streamlit>=1.54.0",
    "beautifulsoup4>=4.10.0",
    "requests>=2.28.0",
    "watchdog",
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    "streamlit-mermaid>=0.3.0",
    "mermaid-py>=0.5.0",
    "streamlit-ace>=0.1.1",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
inspector = ["streamlit-ace>=0.1.1"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["streamtex*"]

[tool.setuptools.package-data]
"streamtex.static" = ["*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
# Files with embedded HTML/CSS/JS/SVG strings that cannot be shortened
"streamtex/bib_preview.py" = ["E501"]
"streamtex/marker.py" = ["E501"]
"streamtex/collection.py" = ["E501"]
"streamtex/grid.py" = ["E501"]
"streamtex/link_preview.py" = ["E501"]
"streamtex/list.py" = ["E501"]
"streamtex/image.py" = ["E501"]
# Re-export file with intentional import organization by section
"streamtex/utils.py" = ["I001"]
