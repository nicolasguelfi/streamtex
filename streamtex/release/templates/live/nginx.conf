# stx-live — the MINIMAL nginx of the image. The whole configuration lives on the server disk:
# /srv/live/conf/stx-http.conf (written by `stx release server-config`; on first start, copied from
# the image by entrypoint.sh). Changing the configuration needs no image rebuild.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /srv/live/conf/stx-http.conf;
}
