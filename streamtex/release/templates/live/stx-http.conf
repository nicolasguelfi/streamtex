# stx-http.conf — the configuration of the live (Streamlit) application, ON THE SERVER DISK
# (/srv/live/conf/stx-http.conf, included by the minimal nginx of the image).
# `stx release server-config` updates it (nginx -t, then a reload without interruption).
#
# The router: the host name names the site, a table gives its port.
# chat1d-slides.example.org -> site "chat1d-slides" -> conf/ports.map -> 127.0.0.1:<port>.
#
# Password: the SAME password-only screen as the HTML face. The stx_auth service (127.0.0.1:9100, started
# by supervisord) checks the records (/srv/live/sites/<site>/pass) and sets a session cookie "stx_live",
# valid in every tab.

include       /etc/nginx/mime.types;
default_type  application/octet-stream;
# The log carries the site and the LABEL of the password that opened the session; never the password.
log_format    stx '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" site=$site label=$stx_label';
access_log    /dev/stdout stx;
sendfile      on;
server_tokens off;

# The real address of the visitor (Traefik gives it): without it, the attempt limit would target Traefik.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $host $site {
    ~^(?<label>[a-z0-9-]+)\.  $label;
    default                   "";
}
map $site $port {
    include /srv/live/conf/ports.map;
    default "";
}
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Only form SUBMISSIONS count, per address AND per site: 50 at once, then 50 per minute.
map $request_method $stx_login_key { POST "$binary_remote_addr$site"; default ""; }
limit_req_zone $stx_login_key zone=stxlogin:10m rate=50r/m;
limit_req_status 429;

# The login service, over kept-alive connections: nginx keeps up to 16 connections open instead of
# opening one per check (about 150 when a page loads).
upstream stx_auth {
    server 127.0.0.1:9100;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;

    location = /_health { access_log off; return 200 "ok\n"; }

    # Streamlit's health, read by `stx release` to know whether a site started: no password.
    location = /_stcore/health {
        if ($port = "") { return 404; }
        proxy_pass http://127.0.0.1:$port;
    }

    # The site's media, from the disk, without a password.
    # A prefix, not a regex: the regex of `map $host $site` would overwrite the $1 capture.
    location /app/static/ {
        alias /srv/live/sites/$site/static/;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # The question asked of the service on every protected request.
    location = /_stx_auth {
        internal;
        proxy_pass http://stx_auth/check;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # keep the connection to the service open
        proxy_connect_timeout 2s;              # an incident fails fast instead of blocking 60 s
        proxy_read_timeout 10s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Site $site;
        proxy_set_header X-Stx-Site $site;            # the library's login service
        proxy_set_header Host $host;                 # the login page shows the site, not 127.0.0.1:9100
        proxy_set_header X-Stx-Cookie stx_live;
        proxy_set_header X-Stx-Login /_login;
        proxy_set_header X-Stx-Home /;
        proxy_set_header Cookie $http_cookie;
    }

    # Without a session: the login page, served AT THE requested address (the visitor comes back to it).
    location @stx_login {
        rewrite ^ /login? break;            # a named location takes no path in proxy_pass
        proxy_pass http://127.0.0.1:9100;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Site $site;
        proxy_set_header X-Stx-Site $site;            # the library's login service
        proxy_set_header Host $host;                 # the login page shows the site, not 127.0.0.1:9100
        proxy_set_header X-Stx-Cookie stx_live;
        proxy_set_header X-Stx-Login /_login;
        proxy_set_header X-Stx-Home /;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept-Language $http_accept_language;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The form: 50 submissions per minute, per address and per site.
    location = /_login {
        limit_req zone=stxlogin burst=50 nodelay;
        proxy_pass http://127.0.0.1:9100/login;
        proxy_set_header X-Site $site;
        proxy_set_header X-Stx-Site $site;            # the library's login service
        proxy_set_header Host $host;                 # the login page shows the site, not 127.0.0.1:9100
        proxy_set_header X-Stx-Cookie stx_live;
        proxy_set_header X-Stx-Login /_login;
        proxy_set_header X-Stx-Home /;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept-Language $http_accept_language;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        if ($port = "") { return 404; }
        auth_request /_stx_auth;
        auth_request_set $stx_label $upstream_http_x_stx_label;
        error_page 401 = @stx_login;
        proxy_pass http://127.0.0.1:$port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host keeps the port: Streamlit refuses the websocket when the browser's origin (with its port)
        # does not match the host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
