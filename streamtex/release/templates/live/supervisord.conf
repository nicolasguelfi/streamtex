; stx-live — one Streamlit process per published site, plus the nginx router.
; The programs of the sites are written by `stx release publish` in the volume
; (/srv/live/conf/programs/<site>.conf), then taken into account by
; `supervisorctl reread && supervisorctl update`: no container restart.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The password-only login screen: the same service as the HTML face, set up for the live face —
; its cookie (stx_live), its form (/_login), its home page (/). Read from the server disk.
[program:stx_auth]
command=/usr/local/bin/python3 /srv/live/conf/stx_auth.py
environment=STX_STATIC_ROOT="/srv/live",STX_COOKIE="stx_live",STX_LOGIN_PATH="/_login",STX_HOME="/"
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[include]
files = /srv/live/conf/programs/*.conf
