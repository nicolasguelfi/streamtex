# stx-http.conf — the configuration of the HTML application, ON THE SERVER DISK:
# /srv/static/conf/stx-http.conf, included by the minimal nginx of the image. `stx release server-config`
# updates it (nginx -t, then a reload without interruption).
#
# One nginx server, never rebuilt for content. The site is read from the host name:
# chat1d-slides.example.org -> site "chat1d-slides". Its content lives in the volume:
# /srv/static/sites/<site>/current/ (a link to releases/<release>/, switched by `stx release publish`).
# Nothing here names a site.
#
# Password: a password-only screen, checked by the stx_auth service (127.0.0.1:9100, started by
# 20-stx-auth.sh). nginx asks it on EVERY page whether the session is valid (auth_request); otherwise it
# serves the login page at the requested address. The password records (/srv/static/sites/<site>/pass) are
# read every time: changing a password needs no restart and closes the open sessions. A site without a
# `pass` file is CLOSED: an omission protects.
# Hardening: nothing protected in a shared cache, HSTS, nginx without its version number, a limit on
# password attempts per address (the real address, given by Traefik).

include       /etc/nginx/mime.types;
default_type  application/octet-stream;
# The log carries the site and the LABEL of the password that opened the session; never the password.
log_format    stx '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" site=$site label=$stx_label';
access_log    /dev/stdout stx;
sendfile      on;
gzip on;
gzip_types text/html text/css application/javascript image/svg+xml application/json;
gzip_min_length 1024;
server_tokens off;

# The real address of the visitor (Traefik gives it): without it, the attempt limit would target Traefik.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Only form SUBMISSIONS count (an empty key is not limited), per address AND per site: a class often
# leaves through one address (50 submissions per minute, a burst of 50 for the start of a session).
map $request_method $stx_login_key { POST "$binary_remote_addr$site"; default ""; }
limit_req_zone $stx_login_key zone=stxlogin:10m rate=50r/m;
limit_req_status 429;

# The site = the first label of the host name.
map $host $site {
    ~^(?<label>[a-z0-9-]+)\.  $label;
    default                   "";
}
# The login service, over kept-alive connections: nginx keeps up to 16 connections open instead of
# opening one per check (about 150 when a page loads).
upstream stx_auth {
    server 127.0.0.1:9100;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/static/sites/$site/current;

    # Behind Traefik, nginx would build http:// redirects.
    absolute_redirect off;

    location = /_health { access_log off; return 200 "ok\n"; }

    # The question asked of the service on every protected page.
    location = /_stx_auth {
        internal;
        proxy_pass http://stx_auth/check;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # keep the connection to the service open
        proxy_connect_timeout 2s;              # an incident fails fast instead of blocking 60 s
        proxy_read_timeout 10s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Site $site;
        proxy_set_header X-Stx-Site $site;            # the library's login service
        proxy_set_header Host $host;                 # the login page shows the site, not 127.0.0.1:9100
        proxy_set_header X-Stx-Cookie stx_session;
        proxy_set_header X-Stx-Login /html/_login;
        proxy_set_header X-Stx-Home /html/;
        proxy_set_header Cookie $http_cookie;
    }

    # Without a session: the login page, served AT THE requested address (the visitor comes back to it).
    location @stx_login {
        rewrite ^ /login? break;            # a named location takes no path in proxy_pass
        proxy_pass http://127.0.0.1:9100;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Site $site;
        proxy_set_header X-Stx-Site $site;            # the library's login service
        proxy_set_header Host $host;                 # the login page shows the site, not 127.0.0.1:9100
        proxy_set_header X-Stx-Cookie stx_session;
        proxy_set_header X-Stx-Login /html/_login;
        proxy_set_header X-Stx-Home /html/;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_set_header Accept-Language $http_accept_language;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # The form. Traefik (Coolify) STRIPS the /html prefix before forwarding (StripPrefix): the form arrives
    # on /_login; /html/_login stays for direct access (local target). The stripped prefix travels in
    # X-Forwarded-Prefix.
    location ~ ^(/html)?/_login$ {
        limit_req zone=stxlogin burst=50 nodelay;
        rewrite ^ /login? break;            # a regex location takes no path in proxy_pass
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header X-Site $site;
        proxy_set_header X-Stx-Site $site;            # the library's login service
        proxy_set_header Host $host;                 # the login page shows the site, not 127.0.0.1:9100
        proxy_set_header X-Stx-Cookie stx_session;
        proxy_set_header X-Stx-Login /html/_login;
        proxy_set_header X-Stx-Home /html/;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
        proxy_set_header Accept-Language $http_accept_language;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Service files never leave.
    location ~ ^/html/\. { return 404; }

    location /html/ {
        auth_request /_stx_auth;
        auth_request_set $stx_label $upstream_http_x_stx_label;
        error_page 401 = @stx_login;
        alias /srv/static/sites/$site/current/;
        index index.html;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "stx-static";
    }

    # The root: the project's home site, and the fallback when the proxy strips the /html prefix before
    # forwarding (path routing).
    location / {
        auth_request /_stx_auth;
        auth_request_set $stx_label $upstream_http_x_stx_label;
        error_page 401 = @stx_login;
        root /srv/static/sites/$site/current;
        index index.html;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Served-By "stx-static";
    }
}
