# streamtex/styles/scale_curves.toml
#
# Source of truth for the indexed responsive font scale.
# Each curve provides 29 pt values per breakpoint (desktop / tablet / mobile).
# Editing this file is enough to ship new values — no Python code changes
# required. After editing, regenerate the static CSS block:
#
#   uv run python -m streamtex.styles.scale > /tmp/scale_block.css
#
# Then paste the output into streamtex/static/default.css between the
# BEGIN/END markers in the "Indexed responsive font scale" section.

[metadata]
schema_version = "0.1"
default_curve = "word_processor"

[word_processor]
description = "Classical word-processor scale (Word/Google Docs/LibreOffice lineage). Fine at small sizes, coarser in display range."
desktop = [8, 9, 10, 11, 12, 14, 16, 18, 20, 22, 24, 28, 32, 36, 40, 48, 60, 72, 96, 128, 156, 168, 180, 188, 192, 194, 195, 196, 200]
